<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Security check - ClearSpend</title><link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}"></head><body class="auth-body"><main class="auth-content"><div class="auth-content-inner"><p class="eyebrow">Security check</p><h1>Enter your code</h1><p>We sent a six-digit code to your email address.</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash-message {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}<form method="post" class="auth-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label><span>Security code</span><input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required autofocus></label><button class="primary-button">Verify and sign in</button></form></div></main></body></html>
